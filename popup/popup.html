<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1 id="app-title">👁️ Vision Helper</h1>
        <div class="quick-actions">
          <button id="quick-toggle-theme" class="icon-btn" title="Toggle Theme">🌓</button>
        </div>
      </div>
      <div class="language-switcher">
        <select id="language-selector">
          <option value="en">🇬🇧 English</option>
          <option value="ru">🇷🇺 Русский</option>
        </select>
      </div>
    </header>

    <!-- Quick Stats -->
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-icon">⏱️</span>
        <span class="stat-label" data-i18n="activeTime">Active</span>
        <span class="stat-value" id="active-time">0h</span>
      </div>
      <div class="stat-item">
        <span class="stat-icon">🔄</span>
        <span class="stat-label" data-i18n="switches">Switches</span>
        <span class="stat-value" id="theme-switches">0</span>
      </div>
    </div>

    <div class="section">
      <h2 data-i18n="textSettings">📝 Text Settings</h2>
      <div class="control-group">
        <label for="font-size" data-i18n="fontSize">Font Size</label>
        <div class="slider-container">
          <span class="slider-value" id="font-size-value">0</span>
          <input type="range" id="font-size" min="0" max="10" value="0" step="1">
          <div class="slider-labels">
            <span data-i18n="standard">Standard</span>
            <span>+10</span>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label for="font-family" data-i18n="fontFamily">Font Family</label>
        <select id="font-family">
          <option value="Arial">Arial</option>
          <option value="Verdana">Verdana</option>
          <option value="Helvetica">Helvetica</option>
          <option value="Tahoma">Tahoma</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Georgia">Georgia</option>
          <option value="Courier New">Courier New</option>
          <option value="OpenDyslexic">OpenDyslexic</option>
          <option value="Comic Sans MS">Comic Sans MS</option>
        </select>
      </div>

      <div class="control-group">
        <label class="toggle-container">
          <input type="checkbox" id="bold-text">
          <span class="toggle-slider"></span>
          <span class="toggle-label" data-i18n="boldText">Bold Text</span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2 data-i18n="colorSettings">🎨 Color Settings</h2>
      
      <div class="control-group">
        <label for="dark-mode" data-i18n="colorTheme">Color Theme</label>
        <select id="dark-mode">
          <option value="auto" data-i18n="auto">🕐 Auto (by time)</option>
          <option value="light" data-i18n="lightTheme">☀️ Light</option>
          <option value="dark" data-i18n="darkTheme">🌙 Dark</option>
        </select>
      </div>

      <div class="control-group" id="dark-intensity-group">
        <label for="dark-mode-intensity" data-i18n="darkIntensity">Dark Mode Intensity</label>
        <div class="slider-container">
          <span class="slider-value" id="dark-intensity-value">85%</span>
          <input type="range" id="dark-mode-intensity" min="50" max="100" value="85" step="5">
          <div class="slider-labels">
            <span>50%</span>
            <span>100%</span>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label class="toggle-container">
          <input type="checkbox" id="blue-light-filter">
          <span class="toggle-slider"></span>
          <span class="toggle-label" data-i18n="blueLightFilter">🔵 Blue Light Filter</span>
        </label>
      </div>

      <div class="control-group" id="blue-light-intensity-group" style="display: none;">
        <label for="blue-light-intensity" data-i18n="blueIntensity">Filter Intensity</label>
        <div class="slider-container">
          <span class="slider-value" id="blue-intensity-value">50%</span>
          <input type="range" id="blue-light-intensity" min="0" max="100" value="50" step="10">
          <div class="slider-labels">
            <span>0%</span>
            <span>100%</span>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label for="color-blind-mode" data-i18n="colorBlindMode">Color Blind Mode</label>
        <select id="color-blind-mode">
          <option value="none" data-i18n="none">None</option>
          <option value="protanopia" data-i18n="protanopia">Protanopia (red-blind)</option>
          <option value="deuteranopia" data-i18n="deuteranopia">Deuteranopia (green-blind)</option>
          <option value="tritanopia" data-i18n="tritanopia">Tritanopia (blue-blind)</option>
          <option value="achromatopsia" data-i18n="achromatopsia">Achromatopsia (total color blindness)</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h2 data-i18n="accessibilityTools">♿ Accessibility Tools</h2>
      
      <div class="control-group">
        <label class="toggle-container">
          <input type="checkbox" id="focus-mode">
          <span class="toggle-slider"></span>
          <span class="toggle-label" data-i18n="focusMode">🎯 Focus Mode (Dim Distractions)</span>
        </label>
      </div>

      <div class="control-group">
        <label class="toggle-container">
          <input type="checkbox" id="text-to-speech" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label" data-i18n="enableTextToSpeech">🔊 Text-to-Speech</span>
        </label>
      </div>

      <div class="control-group" id="speech-volume-group">
        <label for="speech-volume" data-i18n="speechVolume">Speech Volume</label>
        <div class="slider-container">
          <span class="slider-value" id="speech-volume-value">100%</span>
          <input type="range" id="speech-volume" min="0" max="100" value="100" step="5">
          <div class="slider-labels">
            <span>0%</span>
            <span>100%</span>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label class="toggle-container">
          <input type="checkbox" id="magnifier-enabled" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label" data-i18n="enableMagnifier">🔍 Text Magnifier</span>
        </label>
      </div>

      <div class="control-group">
        <label class="toggle-container">
          <input type="checkbox" id="show-time-notification" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label" data-i18n="showTimeNotifications">🔔 Theme Change Notifications</span>
        </label>
      </div>
    </div>

    <!-- Support Section -->
    <div class="section donate-section">
      <h2 data-i18n="supportProject">💝 Support Project</h2>
      <p data-i18n="donateMessage">If you find this extension helpful, consider supporting its development!</p>
      <div class="donate-buttons">
        <button id="buy-me-coffee" class="donate-button primary" data-i18n="buyMeCoffee">☕ Buy Me a Coffee</button>
        <button id="bank-transfer" class="donate-button secondary" data-i18n="bankTransfer">🏦 Bank Transfer</button>
      </div>
    </div>

    <div class="footer">
      <button id="options-button" class="btn-secondary" data-i18n="advancedSettings">⚙️ Advanced Settings</button>
      <p class="version">v1.0.0</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
